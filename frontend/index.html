<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайная шутка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .joke-container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Случайная шутка</h1>
    <div class="joke-container" id="jokeText">
        Загрузка шутки...
    </div>
    <button onclick="getJoke()" id="jokeButton">Ещё шутка</button>

    <script>
        async function getJoke() {
            const button = document.getElementById('jokeButton');
            const jokeContainer = document.getElementById('jokeText');
            
            button.disabled = true;
            
            try {
                const response = await fetch('http://localhost/api/jokes/random/');
                if (!response.ok) {
                    throw new Error('Не удалось получить шутку');
                }
                const data = await response.json();
                jokeContainer.textContent = data.text;
            } catch (error) {
                jokeContainer.textContent = 'Произошла ошибка при загрузке шутки';
                console.error('Erorr:', error);
            } finally {
                button.disabled = false;
            }
        }

        getJoke();
    </script>
</body>
</html>
